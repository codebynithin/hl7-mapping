# One web service: Express serves /api and the built Angular app.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hl7-mapping
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_NAME
        value: config-service
      # Set this in the Render dashboard. Use a MongoDB host Render can reach
      # (for example Atlas). mongodb://localhost is not reachable from Render.
      - key: MONGO_URI
        sync: false
      # Optional. The UI is served by this same service, so browser calls to
      # /api are same-origin and do not need CORS. Set this only for other clients.
      - key: CORS_ORIGIN
        sync: false
